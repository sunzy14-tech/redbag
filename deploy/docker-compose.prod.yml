services:
  mysql:
    image: mysql:8.0
    container_name: redbag-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - ./server.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - redbag-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: redbag-backend
    restart: unless-stopped
    env_file:
      - ./server.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - redbag-exports:/app/storage/exports
      - redbag-qrcodes:/app/storage/qrcodes
      - ./certs:/app/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - redbag-net

  nginx:
    image: nginx:1.27-alpine
    container_name: redbag-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - redbag-net

volumes:
  mysql-data:
  redbag-exports:
  redbag-qrcodes:

networks:
  redbag-net:
    driver: bridge

