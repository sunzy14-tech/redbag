services:
  mysql:
    image: mysql:8.0
    container_name: redbag-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: redbag
      MYSQL_USER: redbag
      MYSQL_PASSWORD: redbag_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: node:20-alpine
    container_name: redbag-backend
    working_dir: /app
    command: sh -c "npm install && npm run db:init && npm start"
    env_file:
      - ../backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ../backend:/app
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:

