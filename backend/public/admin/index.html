<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商户品牌红包管理端</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="shell">
    <section class="login-panel" id="loginPanel">
      <div>
        <p class="eyebrow">Brand Redpacket</p>
        <h1>商户品牌红包管理端</h1>
        <p class="muted">登录后可配置产品、红包策略，并按批次生成二维码。</p>
      </div>
      <form id="loginForm" class="stack">
        <label>
          <span>用户名</span>
          <input name="username" autocomplete="username" value="admin" required>
        </label>
        <label>
          <span>密码</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">登录</button>
        <p class="message" id="loginMessage"></p>
      </form>
    </section>

    <section class="dashboard hidden" id="dashboard">
      <header class="topbar">
        <div>
          <p class="eyebrow">Dashboard</p>
          <h1>品牌红包后台</h1>
        </div>
        <button class="ghost" id="logoutButton" type="button">退出登录</button>
      </header>

      <div class="grid">
        <section class="panel">
          <h2>产品配置</h2>
          <form id="productForm" class="stack compact">
            <input name="name" placeholder="产品名称" required>
            <input name="sku" placeholder="SKU / 产品编码" required>
            <textarea name="description" placeholder="产品说明"></textarea>
            <button type="submit">新增产品</button>
          </form>
          <div class="list" id="productList"></div>
        </section>

        <section class="panel">
          <h2>红包策略</h2>
          <form id="strategyForm" class="stack compact">
            <input name="name" placeholder="策略名称" required>
            <select name="type" required>
              <option value="random">随机金额</option>
              <option value="fixed">固定金额</option>
              <option value="probability">随机概率</option>
            </select>
            <div class="row">
              <input name="winRate" type="number" min="0" max="100" step="0.01" value="99.9" placeholder="中奖率%">
              <input name="fixedAmount" type="number" min="0.01" step="0.01" placeholder="固定金额">
            </div>
            <div class="row">
              <input name="minAmount" type="number" min="0.01" step="0.01" value="0.3" placeholder="最小金额">
              <input name="maxAmount" type="number" min="0.01" step="0.01" value="8.8" placeholder="最大金额">
            </div>
            <button type="submit">新增策略</button>
          </form>
          <div class="list" id="strategyList"></div>
        </section>

        <section class="panel wide">
          <h2>二维码批次</h2>
          <form id="batchForm" class="batch-form">
            <input name="batchNo" placeholder="批次号，如 BATCH20260523001" required>
            <select name="productId" id="batchProduct" required></select>
            <select name="strategyId" id="batchStrategy" required></select>
            <input name="quantity" type="number" min="1" max="10000" value="100" required>
            <input name="factoryName" placeholder="印刷厂名称">
            <input name="remark" placeholder="备注">
            <button type="submit">生成二维码</button>
          </form>
          <div class="list table" id="batchList"></div>
        </section>
      </div>

      <p class="message" id="pageMessage"></p>
    </section>
  </main>

  <script src="/admin/admin.js"></script>
</body>
</html>
